[workspace]
resolver = "3"
members = ["crates/symphony-core", "crates/symphony-hub"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/HiImRook/valid-symphony"
authors = ["Rook"]
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
