name: Security Audit
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Vendor dependencies
        run: cargo vendor vendor

      - name: Configure vendored build
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CARGO_CONFIG'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          CARGO_CONFIG

      - name: Run audit
        run: cargo audit

      - name: Build offline
        run: cargo build --release --locked --offline
